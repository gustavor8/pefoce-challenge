<div class="spin-wrapper" [class]="variant">
  <svg
    viewBox="0 0 100 100"
    class="logo"
    xmlns="http://www.w3.org/2000/svg"
    [style.width.px]="sizeInPx"
    [style.height.px]="sizeInPx"
  >
    <circle
      class="outer-circle circle-bottom"
      cx="50"
      cy="65"
      r="10"
      fill="none"
      stroke-width="3"
      stroke-dasharray="60, 7"
      stroke-dashoffset="-45.5"
    />
    <circle class="inner-circle circle-bottom" cx="50" cy="65" r="5" />

    <circle
      class="outer-circle circle-left"
      cx="30"
      cy="30"
      r="10"
      fill="none"
      stroke-width="3"
      stroke-dasharray="55, 7"
      stroke-dashoffset="-66"
    />
    <circle class="inner-circle circle-left" cx="30" cy="30" r="5" />

    <circle
      class="outer-circle circle-right"
      cx="70"
      cy="30"
      r="10"
      fill="none"
      stroke-width="3"
      stroke-dasharray="60, 8"
      stroke-dashoffset="43"
    />
    <circle class="inner-circle circle-right" cx="70" cy="30" r="5" />

    <line x1="50" y1="65" x2="35" y2="40" class="line line1" />
    <line x1="30" y1="30" x2="60" y2="30" class="line line2" />
    <line x1="70" y1="30" x2="55" y2="57" class="line line3" />
  </svg>
</div>
