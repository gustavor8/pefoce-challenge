<div class="container">
  <div class="error-content">
    <div class="error-card">
      <h1 class="error-code">{{ errorCode }}</h1>
      <div class="error-description">
        <h2 class="error-title">{{ errorTitle }}</h2>
        <p class="error-message">{{ errorMessage }}</p>
      </div>
      <app-button
        [label]="buttonText"
        [size]="'lg'"
        [variant]="'primary'"
        (click)="goToPage()"
      ></app-button>
    </div>
  </div>
</div>
