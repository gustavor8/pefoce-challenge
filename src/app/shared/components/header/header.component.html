<header class="header" [ngClass]="headerClasses" [ngStyle]="headerStyles()">
  @if(showMenuButton) {
  <div class="header__left">
    <button
      class="header__menu-button"
      [class.is-open]="isMenuOpen"
      (click)="onMenuClick()"
      aria-label="Abrir menu"
    >
      <svg width="24" height="24" viewBox="0 0 24 24" fill="#000000">
        <rect class="line line1" x="3" y="6" width="18" height="2"></rect>
        <rect class="line line2" x="3" y="11" width="18" height="2"></rect>
        <rect class="line line3" x="3" y="16" width="18" height="2"></rect>
      </svg>
    </button>
  </div>
  }

  <div class="header__center">
    <ng-content select="[slot='center']"></ng-content>
  </div>

  <div class="header__right">
    <ng-content select="[slot='right']"></ng-content>
  </div>
</header>
